[project]
name = "unipath-ai"
version = "0.1.0"
description = "UniPath AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.1",
    "openai>=1.55.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
]

[tool.fastapi]
entrypoint = "app.main:app"